<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tài khoản – ShanCha Store</title>
  <meta name="description" content="Trang cá nhân ShanCha Store: xem và sửa thông tin tài khoản, theo dõi lịch sử đơn hàng.">
  <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <!-- ============================================================
       TRANG TÀI KHOẢN (profile.html)
       - Cột trái : thẻ thông tin tài khoản (avatar, tên, email, SĐT, vai trò)
                    + nút Đăng xuất.
       - Cột phải : form sửa thông tin cá nhân + Lịch sử đơn hàng
                    (mã đơn, trạng thái, món, tổng tiền).
       - BẢO VỆ   : chưa đăng nhập thì profile.js hiện thông báo đăng nhập.
       ============================================================ -->
  <main>
    <section class="section">
      <div class="container">
        <div class="section-head">
          <span class="section-eyebrow">Tài khoản</span>
          <h2 class="section-title">Trang cá nhân</h2>
        </div>

        <div id="profile-layout" class="story-grid" style="grid-template-columns:1fr 1.6fr;gap:28px;align-items:start">

          <!-- Cột trái: thẻ thông tin tài khoản -->
          <div class="form-card profile-card" style="max-width:none;box-shadow:none;border-radius:var(--radius);text-align:center">
            <div id="pf-info"></div>
            <button class="btn btn-outline btn-block" id="btn-logout-profile" style="margin-top:18px">Đăng xuất</button>
          </div>

          <!-- Cột phải: sửa thông tin + lịch sử đơn -->
          <div>
            <div class="form-card" style="max-width:none;box-shadow:none;border-radius:var(--radius)">
              <h3 style="margin-bottom:16px">Thông tin cá nhân</h3>
              <form id="profile-form" novalidate>
                <div class="form-group">
                  <label for="pf-name">Họ tên</label>
                  <input type="text" id="pf-name" placeholder="Nguyễn Văn A" autocomplete="name">
                  <div class="error">Họ tên phải có ít nhất 2 ký tự.</div>
                </div>
                <div class="form-group">
                  <label for="pf-email">Email</label>
                  <input type="email" id="pf-email" placeholder="you@email.com" autocomplete="email">
                  <div class="error">Email không đúng định dạng.</div>
                </div>
                <div class="form-group">
                  <label for="pf-phone">Số điện thoại</label>
                  <input type="tel" id="pf-phone" placeholder="0901234567" autocomplete="tel">
                  <div class="error">SĐT không đúng định dạng (VD: 0901234567).</div>
                </div>
                <button class="btn btn-primary btn-block" type="submit">Lưu thay đổi</button>
              </form>
            </div>

            <div class="form-card" style="max-width:none;box-shadow:none;border-radius:var(--radius);margin-top:24px">
              <h3 style="margin-bottom:16px">Lịch sử đơn hàng</h3>
              <div id="pf-orders"></div>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
