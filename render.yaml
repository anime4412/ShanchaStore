# ============================================================
#   ShanChaStore - Render Blueprint (render.yaml)
#   Deploy nhanh lên Render.com: tạo Blueprint -> chọn repo -> tự chạy.
#
#   LƯU Ý QUAN TRỌNG:
#   - Bản FREE của Render KHÔNG hỗ trợ Disk -> không khai báo disk ở đây.
#     Database (database.db) + upload sẽ nằm trong filesystem tạm của instance,
#     nên khi server ngủ/restart, dữ liệu sẽ QUAY VỀ dữ liệu mẫu ban đầu.
#     Đủ để demo / nộp bài; muốn bán hàng thật lâu dài thì nâng lên
#     bản Starter (có Disk) và thêm khối `disk` như trong README.
#   - ADMIN_PASSWORD: Render sẽ hỏi riêng khi tạo service (không hardcode).
# ============================================================
services:
  - type: web
    name: shancha-store
    runtime: node
    plan: free
    buildCommand: true   # không cần build (zero npm dep)
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 3000
      # Bỏ DATABASE_PATH + UPLOAD_DIR: server tự dùng database.db và uploads/
      # trong thư mục dự án (hành vi mặc định).
      - key: ADMIN_PASSWORD
        sync: false      # bạn nhập mật khẩu admin riêng khi tạo service
